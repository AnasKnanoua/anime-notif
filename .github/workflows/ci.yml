name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Job 1 — Qualité de code (lint + format + tests)
  # ═══════════════════════════════════════════════════════════════════════
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérifier le formatage
        run: npm run format:check

      - name: Tests
        run: npm test

  # ═══════════════════════════════════════════════════════════════════════
  # Job 2 — Sécurité (secrets + vulnérabilités)
  # ═══════════════════════════════════════════════════════════════════════
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit des dépendances
        run: npm audit --audit-level=high || true

      - name: SAST — Semgrep
        run: |
          docker run --rm -v ${{ github.workspace }}:/src \
            semgrep/semgrep semgrep \
            --config=p/javascript \
            --config=p/security-audit \
            --error \
            /src

  # ═══════════════════════════════════════════════════════════════════════
  # Job 3 — Build et scan de l'image Docker
  # ═══════════════════════════════════════════════════════════════════════
  build:
    needs: [quality, security]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Normaliser le nom d'image en minuscules
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Générer le SBOM — web
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:latest image \
            --format spdx-json \
            --output /tmp/sbom-web.json \
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }} || true

      - name: Archiver le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-web
          path: /tmp/sbom-web.json

      # ── Build des images ───────────────────────────────────────────────
      - name: Build image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}

      - name: Build image worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/worker/Dockerfile
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/worker:${{ github.sha }}

      # ── Scan de sécurité des images ────────────────────────────────────
      - name: Scan Trivy — web
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            ghcr.io/aquasecurity/trivy:latest image \
            --config /workspace/trivy.yaml \
            --ignorefile /workspace/.trivyignore \
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}

      - name: Scan Trivy — worker
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            ghcr.io/aquasecurity/trivy:latest image \
            --config /workspace/trivy.yaml \
            --ignorefile /workspace/.trivyignore \
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}

      # ── Push (seulement sur main, pas sur les PR) ─────────────────────
      - name: Push images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}/worker:${{ github.sha }}

          docker tag ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }} \
                     ${{ env.IMAGE_PREFIX }}/web:latest
          docker tag ${{ env.IMAGE_PREFIX }}/worker:${{ github.sha }} \
                     ${{ env.IMAGE_PREFIX }}/worker:latest
          docker push ${{ env.IMAGE_PREFIX }}/web:latest
          docker push ${{ env.IMAGE_PREFIX }}/worker:latest
  #-------------------------------------------------------------
  #Job Integration
  #-------------------------------------------------------------
  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Créer un .env de test
        run: |
          cat > .env << 'EOF'
          ANIME_WEB_PASSWORD_HASH=$2b$12$abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ012
          DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/000/test
          DEFAULT_DISCORD_WEBHOOK=https://discord.com/api/webhooks/000/test
          SUBSCRIPTIONS_PATH=/data/subscriptions.json
          TZ=Europe/Paris
          SCRAPE_INTERVAL_MINUTES=30
          GRAFANA_ADMIN_PASSWORD=test
          EOF

      - name: Préparer les données de test
        run: |
          mkdir -p data
          cp subscriptions.example.json data/subscriptions.json

      - name: Lancer uniquement le service web
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build web

      - name: Attendre que le service soit healthy
        run: |
          echo "Attente du démarrage..."
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' anime-notif-web 2>/dev/null || echo "starting")
            echo "Tentative $i : $status"
            if [ "$status" = "healthy" ]; then
              echo "✅ Le service est healthy"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Le service n'est jamais devenu healthy"
          docker compose -f deploy/docker-compose.yml logs web
          exit 1

      - name: Vérifier que /health répond
        run: |
          curl -f http://localhost:3001/health || {
            echo "❌ /health ne répond pas"
            docker compose -f deploy/docker-compose.yml logs web
            exit 1
          }

      - name: Nettoyer
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  #---------------------------------------------------------------------------------------
  #Job Release
  #---------------------------------------------------------------------------------------
  release:
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
