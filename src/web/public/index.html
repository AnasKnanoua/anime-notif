<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎌 Anime Tracker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, sans-serif;
        background: #0f0f1a;
        color: #eee;
        min-height: 100vh;
        padding: 2rem 1rem;
      }
      h1 {
        text-align: center;
        font-size: 1.8rem;
        margin-bottom: 0.4rem;
      }
      p.sub {
        text-align: center;
        color: #666;
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }
      .container {
        max-width: 560px;
        margin: 0 auto;
      }
      .card {
        background: #1a1a2e;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      h2 {
        font-size: 1rem;
        color: #aaa;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      label {
        display: block;
        color: #888;
        font-size: 0.82rem;
        margin-bottom: 0.3rem;
        margin-top: 0.8rem;
      }
      label:first-of-type {
        margin-top: 0;
      }
      input {
        width: 100%;
        padding: 0.65rem 0.9rem;
        background: #0d0d1a;
        border: 1px solid #2a2a44;
        border-radius: 8px;
        color: #eee;
        font-size: 0.95rem;
      }
      input:focus {
        outline: none;
        border-color: #6c63ff;
      }
      button.primary {
        width: 100%;
        margin-top: 1rem;
        padding: 0.75rem;
        background: #6c63ff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button.primary:hover {
        background: #574fd6;
      }
      .msg {
        text-align: center;
        font-size: 0.85rem;
        margin-top: 0.6rem;
        min-height: 1.1rem;
      }
      .ok {
        color: #4ade80;
      }
      .err {
        color: #f87171;
      }
      .anime-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 0.9rem;
        background: #0d0d1a;
        border-radius: 8px;
        margin-bottom: 0.5rem;
      }
      .anime-info {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .anime-name {
        font-size: 0.95rem;
        font-weight: 500;
      }
      .anime-ep {
        font-size: 0.75rem;
        color: #6c63ff;
      }
      .btn-del {
        background: none;
        border: 1px solid #7f1d1d;
        color: #f87171;
        padding: 0.3rem 0.7rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.8rem;
        white-space: nowrap;
        margin-left: 1rem;
      }
      .btn-del:hover {
        background: #7f1d1d;
      }
      .empty {
        text-align: center;
        color: #444;
        font-size: 0.9rem;
        padding: 1rem 0;
      }
      .hint {
        font-size: 0.78rem;
        color: #555;
        margin-top: 0.4rem;
      }
      #app {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎌 Anime Tracker</h1>
      <p class="sub">Reçois une notif Discord dès qu'un nouvel épisode sort sur VoirAnime</p>

      <div class="card" id="login-card">
        <h2>Accès</h2>
        <label>Mot de passe</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          onkeydown="if (event.key === 'Enter') login();"
        />
        <button class="primary" onclick="login()">Entrer</button>
        <div class="msg" id="msg-login"></div>
      </div>

      <div id="app">
        <div class="card">
          <h2>Animes suivis</h2>
          <div id="anime-list"><p class="empty">Chargement...</p></div>
        </div>

        <div class="card">
          <h2>Suivre un nouvel anime</h2>
          <label>Nom de l'anime</label>
          <input id="anime-name" type="text" placeholder="Ex: Solo Leveling" />
          <label>URL sur VoirAnime</label>
          <input id="anime-url" type="text" placeholder="https://voir-anime.to/anime/..." />
          <p class="hint">Va sur voir-anime.to, ouvre la page de l'anime et copie l'URL.</p>
          <button class="primary" onclick="subscribe()">+ S'abonner</button>
          <div class="msg" id="msg-add"></div>
        </div>
      </div>
    </div>

    <script>
      let PASSWORD = '';

      function headers() {
        return { 'Content-Type': 'application/json', 'x-password': PASSWORD };
      }

      async function login() {
        PASSWORD = document.getElementById('password').value;
        const res = await fetch('/api/subscriptions', { headers: headers() });
        if (res.status === 401) {
          document.getElementById('msg-login').textContent = 'Mot de passe incorrect';
          document.getElementById('msg-login').className = 'msg err';
          return;
        }
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        renderList(await res.json());
      }

      async function loadSubs() {
        const res = await fetch('/api/subscriptions', { headers: headers() });
        renderList(await res.json());
      }

      function renderList(subs) {
        const list = document.getElementById('anime-list');
        if (!subs.length) {
          list.innerHTML = '<p class="empty">Aucun anime suivi pour l\'instant.</p>';
          return;
        }
        list.innerHTML = subs
          .map(
            (s) => `
        <div class="anime-item">
          <div class="anime-info">
            <span class="anime-name">${s.anime_name}</span>
            <span class="anime-ep">Dernier épisode notifié : ${s.last_episode || '—'}</span>
          </div>
          <button class="btn-del" onclick="unsubscribe('${s.anime_url}')">Retirer</button>
        </div>
      `,
          )
          .join('');
      }

      async function subscribe() {
        const name = document.getElementById('anime-name').value.trim();
        const url = document.getElementById('anime-url').value.trim();
        const msg = document.getElementById('msg-add');
        if (!name || !url) {
          msg.textContent = 'Remplis les deux champs.';
          msg.className = 'msg err';
          return;
        }
        if (!url.startsWith('https://voir-anime.to/anime/')) {
          msg.textContent = 'URL invalide.';
          msg.className = 'msg err';
          return;
        }
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ anime_name: name, anime_url: url }),
        });
        const data = await res.json();
        if (data.success) {
          msg.textContent = '✅ Abonné !';
          msg.className = 'msg ok';
          document.getElementById('anime-name').value = '';
          document.getElementById('anime-url').value = '';
          loadSubs();
        } else {
          msg.textContent = data.error;
          msg.className = 'msg err';
        }
      }

      async function unsubscribe(animeUrl) {
        await fetch('/api/unsubscribe', {
          method: 'DELETE',
          headers: headers(),
          body: JSON.stringify({ anime_url: animeUrl }),
        });
        loadSubs();
      }
    </script>
  </body>
</html>
