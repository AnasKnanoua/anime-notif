global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord-webhook.txt
        title: '{{ .GroupLabels.alertname }}'
        message: |-
          {{ range .Alerts }}
          **{{ .Labels.severity }}** — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
