name: anime-notif-staging

services:
  web-staging:
    build:
      context: ..
      dockerfile: Dockerfile
    image: anime-notif-web:staging
    container_name: anime-notif-web-staging
    restart: unless-stopped
    env_file: ../.env.staging
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Paris}
    ports:
      - '127.0.0.1:4001:3000' # port 4001 au lieu de 3001
    volumes:
      - ../data-staging:/data # données séparées
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true

  worker-staging:
    build:
      context: ..
      dockerfile: src/worker/Dockerfile
    image: anime-notif-worker:staging
    container_name: anime-notif-worker-staging
    restart: unless-stopped
    env_file: ../.env.staging
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ../data-staging:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
